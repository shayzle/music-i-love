<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>
    (function () {
      const RO_MSG = 'ResizeObserver loop';
      window.addEventListener('error', (e) => {
        if (e && e.message && e.message.indexOf(RO_MSG) !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      }, true);
      window.onerror = function (msg) {
        if (typeof msg === 'string' && msg.indexOf(RO_MSG) !== -1) return true;
        return false;
      };
    })();
  </script>
  <title>Influence Musicale · Shanisya Lahida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --fg: #ffffff;
      --fg-dim: rgba(255,255,255,0.78);
      --fg-faint: rgba(255,255,255,0.38);
      --blue: #2b30ff;
      --cyan: #5dffd6;
      --gutter-x: clamp(20px, 4vw, 64px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--fg);
      font-family: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { width: 100%; min-height: 100vh; }
    a { color: inherit; }
    button { font-family: inherit; }

    .page {
      min-height: 100vh;
      padding: clamp(16px, 2.4vw, 36px) var(--gutter-x);
      padding-bottom: clamp(40px, 8vw, 80px);
    }

    .section-title {
      margin: 0 0 clamp(36px, 6vw, 72px);
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(48px, 11vw, 132px);
      line-height: 1.0;
      letter-spacing: -0.03em;
      color: var(--blue);
      text-wrap: balance;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr);
      gap: clamp(32px, 5vw, 96px);
      align-items: center;
    }
    @media (max-width: 860px) {
      .main-grid { grid-template-columns: 1fr; gap: clamp(24px, 5vw, 40px); }
    }

    .eyebrow {
      font-size: clamp(11px, 1.1vw, 13px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--fg-faint);
      margin-bottom: clamp(16px, 2vw, 28px);
    }
    .body-copy {
      margin: 0;
      font-size: clamp(13px, 1.3vw, 15px);
      line-height: 1.6;
      color: var(--fg);
      max-width: 380px;
      text-wrap: pretty;
    }
    @media (max-width: 860px) { .body-copy { max-width: 100%; } }

    .fan-col { width: 100%; }

    .caption {
      margin-top: clamp(20px, 3vw, 28px);
      text-align: center;
      font-size: clamp(12px, 1.3vw, 14px);
      color: var(--fg-dim);
      letter-spacing: 0.02em;
    }
    .caption-artist { color: var(--blue); font-weight: 700; }
    .caption-sep, .caption-year { color: var(--fg-faint); }

    .dots {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 4px;
      border: none; padding: 0;
      background: rgba(255,255,255,0.22);
      cursor: pointer;
      transition: width 240ms, background 240ms;
    }
    .dot.is-active { width: 22px; background: var(--blue); }

    .hint {
      margin-top: clamp(20px, 3vw, 28px);
      font-size: clamp(10px, 1vw, 11px);
      letter-spacing: 0.22em;
      color: var(--fg-faint);
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 480px) {
      .nav { gap: 14px; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

const ALBUMS = [
  {
    artist: 'Tyler, The Creator',
    title: "Don't Tap The Glass",
    year: 2025,
    spotify: 'https://open.spotify.com/album/1jzv3jwZbt8lYfEtMjiD1R?si=bUYZ914UQmWazN5HgqEoiA',
    cover: 'tyler.jpg',
  },
  {
    artist: 'Radiohead',
    title: 'OK Computer',
    year: 1997,
    spotify: 'https://open.spotify.com/album/6dVIqQ8qmQ5GBnJ9shOYGE?si=4E4PO4a3SJKn48SgVgjxeA',
    cover: 'radiohead.jpg',
  },
  {
    artist: 'Tom Misch',
    title: 'Geography',
    year: 2018,
    spotify: 'https://open.spotify.com/album/0hDnsNkxpMDZrpBlGjldtW?si=NKxt-j1wSDyM-wn-OdHPmQ',
    cover: 'tommisch.jpg',
  },
  {
    artist: 'John Mayer',
    title: 'Continuum',
    year: 2006,
    spotify: 'https://open.spotify.com/album/2gR5VChCr7aKQ2Ybk6vpf3?si=oE7TMLfMQRCqe9vxaQU-Zg',
    cover: 'johnmayer.jpg',
  },
  {
    artist: 'Snoh Aalegra',
    title: 'Feels',
    year: 2017,
    spotify: 'https://open.spotify.com/album/6ptDNtROqkFn0kNvtMIIHz?si=MdA6bifHR8qwDCnKALmvYw',
    cover: 'snoh.jpg',
  },
  {
    artist: 'Starmania',
    title: 'Remasterisé en 2009',
    year: 2009,
    spotify: 'https://open.spotify.com/album/1KfEKYPClCYGHtJWTi6PCQ?si=Y5PWofe7Sya1Xvayj9SjBA',
    cover: 'starmania.jpg',
  },
  {
    artist: 'The Rolling Stones',
    title: 'Exile on Main Street',
    year: 1972,
    spotify: 'https://open.spotify.com/album/5U4dnRZsfW8NmwBBkELFPh?si=OXpMa65ZTBaCwxdaks36hA',
    cover: 'rollingstones.jpg',
  },
];

function useMediaQuery(query) {
  const [matches, setMatches] = React.useState(() =>
    typeof window !== 'undefined' && window.matchMedia ? window.matchMedia(query).matches : false
  );
  React.useEffect(() => {
    const m = window.matchMedia(query);
    const onChange = () => setMatches(m.matches);
    onChange();
    m.addEventListener ? m.addEventListener('change', onChange) : m.addListener(onChange);
    return () => {
      m.removeEventListener ? m.removeEventListener('change', onChange) : m.removeListener(onChange);
    };
  }, [query]);
  return matches;
}

function AlbumCover({ album, isActive }) {
  return (
    <a
      href={isActive ? album.spotify : undefined}
      target="_blank"
      rel="noopener noreferrer"
      onClick={(e) => { if (!isActive) e.preventDefault(); }}
      style={{
        display: 'block',
        width: '100%',
        height: '100%',
        position: 'relative',
        overflow: 'hidden',
        cursor: isActive ? 'pointer' : 'default',
      }}
    >
      <img
        src={album.cover}
        alt={`${album.artist} — ${album.title}`}
        style={{
          width: '100%',
          height: '100%',
          objectFit: 'cover',
          display: 'block',
          pointerEvents: 'none',
        }}
        onError={(e) => {
          e.target.style.display = 'none';
          e.target.parentNode.style.background = '#1a1a1a';
        }}
      />
      {isActive && (
        <div style={{
          position: 'absolute',
          bottom: 10,
          right: 10,
          background: 'rgba(0,0,0,0.6)',
          backdropFilter: 'blur(6px)',
          borderRadius: '50%',
          width: 32,
          height: 32,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#1DB954">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </div>
      )}
    </a>
  );
}

function ArrowBtn({ side, onClick }) {
  return (
    <button
      onClick={onClick}
      aria-label={side === 'left' ? 'Previous album' : 'Next album'}
      style={{
        position: 'absolute',
        [side]: 8,
        top: '50%',
        transform: 'translateY(-50%)',
        width: 44, height: 44,
        borderRadius: '50%',
        background: 'rgba(255,255,255,0.06)',
        border: '1px solid rgba(255,255,255,0.18)',
        backdropFilter: 'blur(8px)',
        WebkitBackdropFilter: 'blur(8px)',
        color: '#fff',
        cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 100,
        transition: 'background 200ms',
        fontFamily: 'Space Mono, monospace',
        fontSize: 18
      }}
      onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(255,255,255,0.16)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.background = 'rgba(255,255,255,0.06)'; }}
    >
      {side === 'left' ? '←' : '→'}
    </button>
  );
}

function Fan({ albums, active, setActive, isMobile }) {
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    let accum = 0;
    const onWheel = (e) => {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      accum += delta;
      if (Math.abs(accum) > 60) {
        const dir = Math.sign(accum);
        accum = 0;
        setActive((i) => (i + dir + albums.length) % albums.length);
        e.preventDefault();
      } else if (Math.abs(e.deltaX) > 0) {
        e.preventDefault();
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [albums.length, setActive]);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    let startX = null;
    let lastJump = 0;
    const onDown = (e) => { startX = e.touches ? e.touches[0].clientX : e.clientX; lastJump = 0; };
    const onMove = (e) => {
      if (startX == null) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = x - startX;
      const threshold = isMobile ? 60 : 80;
      const steps = Math.trunc(dx / threshold);
      const delta = steps - lastJump;
      if (delta !== 0) {
        lastJump = steps;
        setActive((i) => ((i - delta) % albums.length + albums.length) % albums.length);
      }
    };
    const onUp = () => { startX = null; };
    el.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    el.addEventListener('touchstart', onDown, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: true });
    el.addEventListener('touchend', onUp);
    return () => {
      el.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      el.removeEventListener('touchstart', onDown);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onUp);
    };
  }, [albums.length, setActive, isMobile]);

  const stepPx = isMobile ? 70 : 130;
  const coverSize = isMobile ? 'clamp(180px, 60vw, 260px)' : 'clamp(220px, 28vw, 360px)';

  return (
    <div
      ref={wrapRef}
      style={{
        position: 'relative',
        height: isMobile ? 'clamp(280px, 60vw, 360px)' : 'clamp(380px, 56vh, 620px)',
        width: '100%',
        cursor: 'grab',
        userSelect: 'none',
        touchAction: 'pan-y'
      }}
      onMouseDown={(e) => { e.currentTarget.style.cursor = 'grabbing'; }}
      onMouseUp={(e) => { e.currentTarget.style.cursor = 'grab'; }}
      onMouseLeave={(e) => { e.currentTarget.style.cursor = 'grab'; }}
    >
      {albums.map((a, i) => {
        const n = albums.length;
        let offset = i - active;
        if (offset > n / 2) offset -= n;
        if (offset < -n / 2) offset += n;
        const abs = Math.abs(offset);
        const dir = Math.sign(offset);
        if (abs > (isMobile ? 3 : 4)) return null;

        const x = dir * Math.min(abs, 4) * stepPx;
        const scale = abs === 0 ? 1 : 0.86 - Math.min(abs - 1, 3) * 0.05;
        const z = albums.length - abs;
        const opacity = abs > 3 ? 0.0 : abs > 2 ? 0.55 : 1;
        const isActive = abs === 0;

        return (
          <div
            key={a.title}
            onClick={() => { if (!isActive) setActive(i); }}
            style={{
              position: 'absolute',
              left: '50%',
              top: '50%',
              width: coverSize,
              aspectRatio: '1 / 1',
              transform: `translate(calc(-50% + ${x}px), -50%) scale(${scale})`,
              transformOrigin: 'center',
              zIndex: z,
              opacity,
              transition: 'transform 520ms cubic-bezier(.2,.8,.2,1), opacity 320ms, box-shadow 320ms',
              cursor: isActive ? 'pointer' : 'pointer',
              boxShadow: isActive
                ? '0 28px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)'
                : '0 14px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04)',
              background: '#111',
              overflow: 'hidden',
            }}
          >
            <AlbumCover album={a} isActive={isActive} />
          </div>
        );
      })}

      <ArrowBtn onClick={() => setActive((i) => (i - 1 + albums.length) % albums.length)} side="left" />
      <ArrowBtn onClick={() => setActive((i) => (i + 1) % albums.length)} side="right" />
    </div>
  );
}

function MusicSection() {
  const [active, setActive] = React.useState(0);
  const isMobile = useMediaQuery('(max-width: 760px)');
  const a = ALBUMS[active];

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'ArrowLeft') setActive((i) => (i - 1 + ALBUMS.length) % ALBUMS.length);
      if (e.code === 'ArrowRight') setActive((i) => (i + 1) % ALBUMS.length);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="page">
      <h2 className="section-title">Influence Musicale</h2>

      <div className="main-grid">
        <div className="text-col">
          <div className="eyebrow">LA MUSIQUE + SHAY</div>
          <p className="body-copy">
            La musique a toujours eu une grande influence sur ma façon de travailler. Le bon album en fond, c'est ce qui me met dans la zone quand je code, quand je design, ou quand je tiens un long projet. Voici les disques qui m'accompagnent.
          </p>
        </div>

        <div className="fan-col">
          <Fan albums={ALBUMS} active={active} setActive={setActive} isMobile={isMobile} />

          <div className="caption">
            <span className="caption-artist">{a.artist}</span>
            <span className="caption-sep"> : </span>
            <span>{a.title}</span>
            <span className="caption-year"> · {a.year}</span>
          </div>

          <div className="dots">
            {ALBUMS.map((_, i) => (
              <button
                key={i}
                onClick={() => setActive(i)}
                aria-label={`Album ${i + 1}`}
                className={'dot' + (i === active ? ' is-active' : '')}
              />
            ))}
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MusicSection />);

  </script>
</body>
</html>
