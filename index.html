  <script>
    // Silence the benign ResizeObserver loop notice (browser quirk; not an error)
    (function () {
      const RO_MSG = 'ResizeObserver loop';
      window.addEventListener('error', (e) => {
        if (e && e.message && e.message.indexOf(RO_MSG) !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return false;
        }
      }, true);
      window.onerror = function (msg) {
        if (typeof msg === 'string' && msg.indexOf(RO_MSG) !== -1) return true;
        return false;
      };
    })();
  </script>

// ── Responsive helper ──────────────────────────────────────────────────────
function useMediaQuery(query) {
  const [matches, setMatches] = React.useState(() =>
  typeof window !== 'undefined' && window.matchMedia ? window.matchMedia(query).matches : false
  );
  React.useEffect(() => {
    const m = window.matchMedia(query);
    const onChange = () => setMatches(m.matches);
    onChange();
    m.addEventListener ? m.addEventListener('change', onChange) : m.addListener(onChange);
    return () => {
      m.removeEventListener ? m.removeEventListener('change', onChange) : m.removeListener(onChange);
    };
  }, [query]);
  return matches;
}

// ── AlbumSlot — drop-in image target with localStorage persistence ─────────
function AlbumSlot({ id, label }) {
  const [src, setSrc] = React.useState(() => {
    try {return localStorage.getItem('album-cover:' + id) || '';} catch {return '';}
  });
  const inputRef = React.useRef(null);

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      setSrc(dataUrl);
      try {localStorage.setItem('album-cover:' + id, dataUrl);} catch {}
      try { window.dispatchEvent(new Event('album-cover-saved')); } catch {}
    };
    reader.readAsDataURL(file);
  };

  const onDrop = (e) => {
    e.preventDefault();e.stopPropagation();
    e.currentTarget.style.outline = '';
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  };
  const onDragOver = (e) => {
    e.preventDefault();e.stopPropagation();
    e.currentTarget.style.outline = '2px solid #2b30ff';
    e.currentTarget.style.outlineOffset = '-2px';
  };
  const onDragLeave = (e) => {
    e.currentTarget.style.outline = '';
  };

  return (
    <div
      onClick={(e) => {e.stopPropagation();inputRef.current && inputRef.current.click();}}
      onDrop={onDrop}
      onDragOver={onDragOver}
      onDragLeave={onDragLeave}
      style={{
        width: '100%', height: '100%',
        background: '#0d0d0d',
        backgroundImage: src ? `url(${src})` : 'none',
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        position: 'relative',
        overflow: 'hidden',
        cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center'
      }}>
      
      {!src &&
      <div style={{
        padding: '0 14px',
        textAlign: 'center',
        color: 'rgba(255,255,255,0.55)',
        fontSize: 11,
        letterSpacing: '0.12em',
        textTransform: 'uppercase',
        lineHeight: 1.5,
        whiteSpace: 'pre-line',
        pointerEvents: 'none'
      }}>
          <div style={{ fontSize: 22, marginBottom: 10, opacity: 0.55 }}>+</div>
          {label}
          <div style={{ marginTop: 12, fontSize: 9, opacity: 0.5 }}>drop image</div>
        </div>
      }
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        style={{ display: 'none' }}
        onChange={(e) => handleFile(e.target.files && e.target.files[0])} />
      
    </div>);

}

// ── Fan — horizontal stack of album covers with center focus ───────────────
function Fan({ albums, active, setActive, isMobile }) {
  const wrapRef = React.useRef(null);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    let accum = 0;
    const onWheel = (e) => {
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      accum += delta;
      if (Math.abs(accum) > 60) {
        const dir = Math.sign(accum);
        accum = 0;
        setActive((i) => (i + dir + albums.length) % albums.length);
        e.preventDefault();
      } else if (Math.abs(e.deltaX) > 0) {
        e.preventDefault();
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [albums.length, setActive]);

  React.useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    let startX = null;
    let lastJump = 0;
    const onDown = (e) => {
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      lastJump = 0;
    };
    const onMove = (e) => {
      if (startX == null) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const dx = x - startX;
      const threshold = isMobile ? 60 : 80;
      const steps = Math.trunc(dx / threshold);
      const delta = steps - lastJump;
      if (delta !== 0) {
        lastJump = steps;
        setActive((i) => ((i - delta) % albums.length + albums.length) % albums.length);
      }
    };
    const onUp = () => {startX = null;};
    el.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    el.addEventListener('touchstart', onDown, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: true });
    el.addEventListener('touchend', onUp);
    return () => {
      el.removeEventListener('mousedown', onDown);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      el.removeEventListener('touchstart', onDown);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onUp);
    };
  }, [albums.length, setActive, isMobile]);

  const stepPx = isMobile ? 70 : 130;
  const coverSize = isMobile ? 'clamp(180px, 60vw, 260px)' : 'clamp(220px, 28vw, 360px)';

  return (
    <div
      ref={wrapRef}
      style={{
        position: 'relative',
        height: isMobile ? 'clamp(280px, 60vw, 360px)' : 'clamp(380px, 56vh, 620px)',
        width: '100%',
        cursor: 'grab',
        userSelect: 'none',
        touchAction: 'pan-y'
      }}
      onMouseDown={(e) => {e.currentTarget.style.cursor = 'grabbing';}}
      onMouseUp={(e) => {e.currentTarget.style.cursor = 'grab';}}
      onMouseLeave={(e) => {e.currentTarget.style.cursor = 'grab';}}>
      
      {albums.map((a, i) => {
        const n = albums.length;
        let offset = i - active;
        if (offset > n / 2) offset -= n;
        if (offset < -n / 2) offset += n;
        const abs = Math.abs(offset);
        const dir = Math.sign(offset);
        if (abs > (isMobile ? 3 : 4)) return null;

        const x = dir * Math.min(abs, 4) * stepPx;
        const scale = abs === 0 ? 1 : 0.86 - Math.min(abs - 1, 3) * 0.05;
        const z = albums.length - abs;
        const opacity = abs > 3 ? 0.0 : abs > 2 ? 0.55 : 1;
        const isActive = abs === 0;

        return (
          <button
            key={a.title}
            onClick={() => setActive(i)}
            aria-label={`${a.artist} — ${a.title}`}
            style={{
              position: 'absolute',
              left: '50%',
              top: '50%',
              width: coverSize,
              aspectRatio: '1 / 1',
              transform: `translate(calc(-50% + ${x}px), -50%) scale(${scale})`,
              transformOrigin: 'center',
              zIndex: z,
              opacity,
              transition: 'transform 520ms cubic-bezier(.2,.8,.2,1), opacity 320ms, box-shadow 320ms',
              padding: 0, border: 0, background: 'transparent',
              cursor: isActive ? 'default' : 'pointer',
              boxShadow: isActive ?
              '0 28px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)' :
              '0 14px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04)'
            }}>
            
            <AlbumSlot id={`album-${i}`} label={`${a.artist}\n${a.title}`} />
          </button>);

      })}

      <ArrowBtn onClick={() => setActive((i) => (i - 1 + albums.length) % albums.length)} side="left" />
      <ArrowBtn onClick={() => setActive((i) => (i + 1) % albums.length)} side="right" />
    </div>);

}

// ── SaveButton ─────────────────────────────────────────────────────────────
// Becomes accessible once the user has added at least one album cover.
// Downloads their album cover collection as a JSON file they can keep / re-import.
function SaveButton({ albums, savedCount, onSaved }) {
  const hasAny = savedCount > 0;
  const handleSave = () => {
    const data = { savedAt: new Date().toISOString(), covers: {} };
    albums.forEach((a, i) => {
      try {
        const v = localStorage.getItem('album-cover:album-' + i);
        if (v) data.covers['album-' + i] = { artist: a.artist, title: a.title, image: v };
      } catch {}
    });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ma-collection-musicale-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    onSaved && onSaved();
  };
  return (
    <button
      type="button"
      onClick={handleSave}
      disabled={!hasAny}
      aria-label="Enregistrer ma collection"
      className={'save-btn' + (hasAny ? ' is-ready' : '')}
    >
      <span aria-hidden="true" style={{ marginRight: 8 }}>↓</span>
      Enregistrer ma sélection
      {hasAny && <span className="save-count">{savedCount}</span>}
    </button>
  );
}

// ── MusicSection ───────────────────────────────────────────────────────────
function MusicSection() {
  const [active, setActive] = React.useState(2);
  const isMobile = useMediaQuery('(max-width: 760px)');
  const a = ALBUMS[active];

  // Track how many albums have a saved cover (drives the Save button)
  const computeSavedCount = React.useCallback(() => {
    let n = 0;
    for (let i = 0; i < ALBUMS.length; i++) {
      try { if (localStorage.getItem('album-cover:album-' + i)) n++; } catch {}
    }
    return n;
  }, []);
  const [savedCount, setSavedCount] = React.useState(computeSavedCount);
  const [justSaved, setJustSaved] = React.useState(false);

  React.useEffect(() => {
    const refresh = () => setSavedCount(computeSavedCount());
    window.addEventListener('album-cover-saved', refresh);
    window.addEventListener('storage', refresh);
    return () => {
      window.removeEventListener('album-cover-saved', refresh);
      window.removeEventListener('storage', refresh);
    };
  }, [computeSavedCount]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'ArrowLeft') setActive((i) => (i - 1 + ALBUMS.length) % ALBUMS.length);
      if (e.code === 'ArrowRight') setActive((i) => (i + 1) % ALBUMS.length);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div className="page">
      <h2 className="section-title">Influence musicale</h2>

      <div className="main-grid">
        <div className="text-col">
          <div className="eyebrow">LA MUSIQUE + Shay</div>
          <p className="body-copy">
            La musique a toujours eu une grande influence sur ma façon de travailler. Le bon album en fond, c'est ce qui me met dans la zone quand je code, quand je design, ou quand je tiens un long projet. Voici les disques qui m'accompagnent. Fais glisser, scrolle, ou utilise les flèches pour naviguer.
          </p>
        </div>

        <div className="fan-col">
          <Fan albums={ALBUMS} active={active} setActive={setActive} isMobile={isMobile} />

          <div className="caption">
            <span className="caption-artist">{a.artist}</span>
            <span className="caption-sep"> : </span>
            <span>{a.title}</span>
            <span className="caption-year"> · {a.year}</span>
          </div>

          <div className="dots">
            {ALBUMS.map((_, i) =>
            <button
              key={i}
              onClick={() => setActive(i)}
              aria-label={`Album ${i + 1}`}
              className={'dot' + (i === active ? ' is-active' : '')} />

            )}
          </div>

          <div className="save-row">
            <SaveButton
              albums={ALBUMS}
              savedCount={savedCount}
              onSaved={() => { setJustSaved(true); setTimeout(() => setJustSaved(false), 2400); }}
            />
            {justSaved && <span className="save-toast" role="status">✓ Fichier téléchargé</span>}
          </div>
        </div>
      </div>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<MusicSection />);

</script>
</body>
</html>
